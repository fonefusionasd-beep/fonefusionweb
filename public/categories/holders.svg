<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="holderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="standShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="30" fill="url(#holderBg)"/>
  <!-- Circular Weighted Base -->
  <ellipse cx="60" cy="94" rx="34" ry="10" fill="#CBD5E1"/>
  <ellipse cx="60" cy="91" rx="30" ry="8" fill="url(#standGrad)"/>
  <!-- Telescopic Stem/Arm -->
  <rect x="56" y="55" width="8" height="36" rx="4" fill="#334155"/>
  <circle cx="60" cy="55" r="7" fill="#FF6B00"/>
  <!-- Phone Cradle Resting on Stand -->
  <g transform="translate(60, 48) rotate(-12)" filter="url(#standShadow)">
    <!-- Backplate -->
    <rect x="-24" y="-30" width="48" height="56" rx="8" fill="#0F172A" stroke="#FF6B00" stroke-width="2"/>
    <!-- Phone Screen area -->
    <rect x="-20" y="-26" width="40" height="48" rx="6" fill="#1E293B"/>
    <circle cx="0" cy="-2" r="8" fill="#FF6B00" opacity="0.3"/>
    <path d="M-4 -2 L4 -2 M0 -6 L0 2" stroke="#FF6B00" stroke-width="2" stroke-linecap="round"/>
    <!-- Bottom Cradle Hooks -->
    <path d="M-18 26 L-18 30 L-10 30" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M18 26 L18 30 L10 30" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>
