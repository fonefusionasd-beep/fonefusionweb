<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="earBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7F0"/>
      <stop offset="100%" stop-color="#FFEADA"/>
    </linearGradient>
    <linearGradient id="headbandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37474F"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>
    <filter id="headShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="30" fill="url(#earBg)"/>
  <!-- Headphone Arc -->
  <path d="M32 62 C32 35 44 24 60 24 C76 24 88 35 88 62" fill="none" stroke="url(#headbandGrad)" stroke-width="7" stroke-linecap="round"/>
  <!-- Headband Cushion -->
  <path d="M44 32 C50 28 70 28 76 32" fill="none" stroke="#FF6B00" stroke-width="4" stroke-linecap="round"/>
  <!-- Left Ear Cup -->
  <g filter="url(#headShadow)">
    <rect x="22" y="54" width="16" height="30" rx="8" fill="#1A1A1A"/>
    <rect x="24" y="58" width="12" height="22" rx="6" fill="#FF6B00"/>
    <circle cx="30" cy="69" r="3" fill="#FFFFFF"/>
  </g>
  <!-- Right Ear Cup -->
  <g filter="url(#headShadow)">
    <rect x="82" y="54" width="16" height="30" rx="8" fill="#1A1A1A"/>
    <rect x="84" y="58" width="12" height="22" rx="6" fill="#FF6B00"/>
    <circle cx="90" cy="69" r="3" fill="#FFFFFF"/>
  </g>
</svg>
