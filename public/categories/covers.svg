<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5EE"/>
      <stop offset="100%" stop-color="#FFE4D6"/>
    </linearGradient>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#E55300"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#FF6B00" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="30" fill="url(#bgGrad)"/>
  <!-- Phone Case Outer -->
  <rect x="36" y="20" width="48" height="80" rx="14" fill="url(#caseGrad)" filter="url(#shadow)"/>
  <!-- Phone Case Inner Cutout/Screen area -->
  <rect x="41" y="25" width="38" height="70" rx="10" fill="#1A1A1A"/>
  <!-- Camera Island on Cover -->
  <rect x="44" y="28" width="18" height="22" rx="5" fill="#2E2E2E" stroke="#FF8F3D" stroke-width="1.5"/>
  <circle cx="50" cy="34" r="3" fill="#111" stroke="#FF6B00" stroke-width="1"/>
  <circle cx="50" cy="43" r="3" fill="#111" stroke="#FF6B00" stroke-width="1"/>
  <circle cx="57" cy="38" r="1.5" fill="#FFE082"/>
  <!-- Corner shock guards -->
  <path d="M36 32 C36 24 44 20 52 20" stroke="#FFB074" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M68 20 C76 20 84 24 84 32" stroke="#FFB074" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Sleek Accent Stripe -->
  <path d="M41 78 L79 78" stroke="#FF7A1A" stroke-width="2" stroke-linecap="round"/>
</svg>
